name: Sync conformance dossier

# Keeps the generated pages in step with the ones built in eduardstan/reasonsmith:
# report.html (one run, one reader) and audiences.html (one run rendered for all five
# audiences). Both are generated there and pinned byte-for-byte by tests there, so this
# workflow copies them and never edits them.
# A push made with the default GITHUB_TOKEN never triggers another workflow, so
# publish.yml does not fire for a sync commit — this workflow calls the deploy
# hook itself instead.

on:
  schedule:
    - cron: "17 * * * *" # hourly at :17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the generated pages from reasonsmith main
        run: |
          # A 404 means "not on main yet" and is not a failure — audiences.html lands after
          # report.html did. A page that is missing upstream leaves the published one alone
          # rather than aborting the sync of the other.
          for page in report.html audiences.html; do
            if ! curl -fsSL "https://raw.githubusercontent.com/eduardstan/reasonsmith/main/docs/$page" -o "$page.new"; then
              echo "$page is not on main yet; skipping it"
              rm -f "$page.new"
              continue
            fi
            if cmp -s "$page.new" "$page"; then
              echo "$page unchanged"
              rm "$page.new"
            else
              mv "$page.new" "$page"
              echo "$page changed"
              echo "changed=true" >> "$GITHUB_ENV"
            fi
          done

      - name: Commit and push if changed
        if: env.changed == 'true'
        run: |
          git config user.name "reasonsmith-site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for page in report.html audiences.html; do
            if [ -f "$page" ]; then git add "$page"; fi
          done
          git commit -m "chore: sync generated pages from eduardstan/reasonsmith@main"
          git push

      - name: Trigger the Vercel deploy hook
        if: env.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          # Fail loudly rather than reporting a green run that published nothing.
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set - the synced pages were committed but not published."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
