<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>reasonsmith — wordmark concepts</title>
<style>
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-normal.woff2") format("woff2-variations"); font-weight: 200 800; }
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-italic.woff2") format("woff2-variations"); font-weight: 200 800; font-style: italic; }
  body { background: #f5f4f0; color: #1c1f25; font-family: Georgia, serif; padding: 2.5rem; }
  h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.2rem; }
  p.sub { font-family: monospace; font-size: 0.75rem; color: #6b6f7d; margin-bottom: 1.5rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  td { padding: 1.4rem 1.6rem; border-bottom: 1px solid #e2e0da; vertical-align: middle; }
  td.name { font-weight: 600; width: 12rem; }
  td.name .src { display: block; font-family: monospace; font-size: 0.68rem; font-weight: 400; color: #6b6f7d; }
  td.dark { background: #1c1f25; }
  svg { display: block; }
  .w { font-family: "Newsreader", Georgia, serif; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
</style></head><body>
<h1>reasonsmith — wordmark concepts</h1>
<p class="sub">abstract / typographic · the name carries the strike · Newsreader + mono</p>
<table>

<!-- w1: redacted 'reason' — the word itself loses its reasons -->
<tr><td class="name">w1 redacted word<span class="src">procedural</span></td>
<td><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#1c1f25">reasonsmith</text>
  <rect x="8" y="24" width="132" height="20" fill="#b71824"/>
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#1c1f25" opacity="0.18">reason</text>
</svg></td>
<td class="dark"><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#f5f4f0">reasonsmith</text>
  <rect x="8" y="24" width="132" height="20" fill="#b71824"/>
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#f5f4f0" opacity="0.18">reason</text>
</svg></td></tr>

<!-- w2: strike through the whole word at x-height -->
<tr><td class="name">w2 one strike<span class="src">procedural</span></td>
<td><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#1c1f25">reasonsmith</text>
  <rect x="0" y="36" width="290" height="4.5" fill="#b71824"/>
</svg></td>
<td class="dark"><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#f5f4f0">reasonsmith</text>
  <rect x="0" y="36" width="290" height="4.5" fill="#b71824"/>
</svg></td></tr>

<!-- w3: the 'o' is a surviving node, strike across four letters -->
<tr><td class="name">w3 node letter<span class="src">procedural</span></td>
<td><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#1c1f25">reas<tspan fill="#2e7d5b">o</tspan>nsmith</text>
  <circle cx="98" cy="43" r="7" fill="none" stroke="#2e7d5b" stroke-width="2.5"/>
  <rect x="115" y="36" width="175" height="4.5" fill="#b71824"/>
</svg></td>
<td class="dark"><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#f5f4f0">reas<tspan fill="#2e7d5b">o</tspan>nsmith</text>
  <circle cx="98" cy="43" r="7" fill="none" stroke="#2e7d5b" stroke-width="2.5"/>
  <rect x="115" y="36" width="175" height="4.5" fill="#b71824"/>
</svg></td></tr>

<!-- w4: italic serif 'reason' + mono 'smith' — two registers, strike between -->
<tr><td class="name">w4 two registers<span class="src">procedural</span></td>
<td><svg width="520" height="80" viewBox="0 0 520 80">
  <text class="w" x="0" y="55" font-size="56" font-weight="400" font-style="italic" letter-spacing="-2" fill="#1c1f25">reason</text>
  <text class="mono" x="140" y="55" font-size="40" font-weight="700" letter-spacing="-1" fill="#1c1f25">smith</text>
  <rect x="132" y="30" width="4" height="34" fill="#b71824"/>
</svg></td>
<td class="dark"><svg width="520" height="80" viewBox="0 0 520 80">
  <text class="w" x="0" y="55" font-size="56" font-weight="400" font-style="italic" letter-spacing="-2" fill="#f5f4f0">reason</text>
  <text class="mono" x="140" y="55" font-size="40" font-weight="700" letter-spacing="-1" fill="#f5f4f0">smith</text>
  <rect x="132" y="30" width="4" height="34" fill="#b71824"/>
</svg></td></tr>

<!-- w5: audit stamp — word under a ruled line, strike as registration mark -->
<tr><td class="name">w5 ruled audit<span class="src">procedural</span></td>
<td><svg class="w" width="520" height="95" viewBox="0 0 520 95">
  <line x1="0" y1="14" x2="340" y2="14" stroke="#1c1f25" stroke-width="1.2"/>
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#1c1f25">reasonsmith</text>
  <line x1="0" y1="72" x2="340" y2="72" stroke="#1c1f25" stroke-width="1.2"/>
  <rect x="248" y="8" width="92" height="12" fill="#b71824"/>
  <text class="mono" x="248" y="88" font-size="11" letter-spacing="2" fill="#6b6f7d">AUDIT ENGINE</text>
</svg></td>
<td class="dark"><svg class="w" width="520" height="95" viewBox="0 0 520 95">
  <line x1="0" y1="14" x2="340" y2="14" stroke="#f5f4f0" stroke-width="1.2"/>
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#f5f4f0">reasonsmith</text>
  <line x1="0" y1="72" x2="340" y2="72" stroke="#f5f4f0" stroke-width="1.2"/>
  <rect x="248" y="8" width="92" height="12" fill="#b71824"/>
  <text class="mono" x="248" y="88" font-size="11" letter-spacing="2" fill="#9a9eb0">AUDIT ENGINE</text>
</svg></td></tr>

<!-- w6: 'reason' ghosted behind redaction bars, 'smith' solid — erasure in progress -->
<tr><td class="name">w6 erasure<span class="src">procedural</span></td>
<td><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#1c1f25" opacity="0.22">reason</text>
  <text x="140" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#1c1f25">smith</text>
  <rect x="4" y="20" width="60" height="10" fill="#b71824" opacity="0.9"/>
  <rect x="70" y="34" width="46" height="10" fill="#b71824" opacity="0.65"/>
  <rect x="30" y="48" width="70" height="10" fill="#b71824" opacity="0.4"/>
</svg></td>
<td class="dark"><svg class="w" width="520" height="80" viewBox="0 0 520 80">
  <text x="0" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#f5f4f0" opacity="0.25">reason</text>
  <text x="140" y="55" font-size="56" font-weight="600" letter-spacing="-1.5" fill="#f5f4f0">smith</text>
  <rect x="4" y="20" width="60" height="10" fill="#b71824" opacity="0.9"/>
  <rect x="70" y="34" width="46" height="10" fill="#b71824" opacity="0.65"/>
  <rect x="30" y="48" width="70" height="10" fill="#b71824" opacity="0.4"/>
</svg></td></tr>

<tr><td class="name">alt codex<span class="src">codex cli</span></td>
<td><img src="wordmark-codex.svg" width="520"></td>
<td class="dark" style="background:#1c1f25"><img src="wordmark-codex.svg" width="520"></td></tr>
<tr><td class="name">alt agy<span class="src">agy cli</span></td>
<td><img src="wordmark-agy.svg" width="520"></td>
<td class="dark" style="background:#1c1f25"><img src="wordmark-agy.svg" width="520"></td></tr>

</table>
</body></html>
